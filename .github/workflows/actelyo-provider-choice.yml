name: Actelyo provider choice
on:
  workflow_dispatch:
  push:
    branches: [codex/actelyo-local-modules-20261003]
    paths:
      - apps/desktop/src/components/onboarding/**
      - .github/workflows/actelyo-provider-choice.yml
permissions:
  contents: read
concurrency:
  group: actelyo-provider-choice
  cancel-in-progress: true
jobs:
  choices:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Prove the old picker fails the new choices
        id: baseline
        continue-on-error: true
        working-directory: apps/desktop
        shell: bash
        run: |
          cp src/components/onboarding/index.tsx "$RUNNER_TEMP/actelyo-picker.tsx"
          git fetch origin 2948aa040bdd0aa76af034992d85f458c49c81e5 --depth=1
          git show 2948aa040bdd0aa76af034992d85f458c49c81e5:apps/desktop/src/components/onboarding/index.tsx > src/components/onboarding/index.tsx
          npx vitest run --project ui src/components/onboarding/index.test.tsx -t 'offers OpenRouter|offers a local endpoint'
      - name: Restore the actual picker
        if: always()
        shell: bash
        run: mv "$RUNNER_TEMP/actelyo-picker.tsx" apps/desktop/src/components/onboarding/index.tsx
      - name: Require a failing baseline
        env:
          BASELINE: ${{ steps.baseline.outcome }}
        run: test "$BASELINE" = failure
      - name: Verify picker and real configuration owners
        working-directory: apps/desktop
        run: npx vitest run --project ui src/components/onboarding/index.test.tsx src/store/onboarding.test.ts src/components/onboarding/skip-gate.test.tsx
      - name: Check formatting
        run: npx prettier --check apps/desktop/src/components/onboarding/index.tsx apps/desktop/src/components/onboarding/providers.tsx apps/desktop/src/components/onboarding/index.test.tsx

