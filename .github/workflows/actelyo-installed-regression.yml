name: Actelyo installed Windows onboarding regression
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  installed:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ACTELYO_SOURCE_SHA: 8a7c8e98fa5e9461e07d004cfd867a654619e52c
    steps:
      # Historical regression: pair the retained 8a7c8e9 installer with its verifier.
      # Current builds are verified by actelyo-law-harness-download.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c8afa40e9eba32611ae2dacb5e04ad4cdd7f0e0a
      - name: Download exact installer built with verified Inno 7
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '11308516119'
          run-id: '37213771073'
          github-token: ${{ github.token }}
          path: candidate
      - name: Install the locked verifier dependency only
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'actelyo-playwright'
          New-Item -ItemType Directory $probe -Force | Out-Null
          '{"private":true,"dependencies":{"playwright":"1.62.1"}}' | Set-Content (Join-Path $probe 'package.json')
          npm install --prefix $probe --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Verifier dependency installation failed' }
          "NODE_PATH=$probe/node_modules" >> $env:GITHUB_ENV
      - name: Install actual previously compiled product
        shell: pwsh
        run: |
          $installer = (Get-ChildItem candidate -Recurse -Filter 'Actelyo-Law-Harness-Setup-x64.exe' | Select-Object -First 1).FullName
          if (-not $installer) { throw 'Exact installer missing' }
          $installed = Join-Path $env:RUNNER_TEMP 'actelyo-regression-installed'
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=`"$installed`"") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Product installation failed' }
          "ACTELYO_INSTALLED=$installed" >> $env:GITHUB_ENV
      - name: Verify first-run skip, real catalogue and product identity
        run: node scripts/actelyo-download/verify-installed.mjs "$env:ACTELYO_INSTALLED" proof
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: actelyo-installed-onboarding-proof
          path: proof

