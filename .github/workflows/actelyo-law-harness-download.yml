name: Actelyo Law Harness Windows download
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit to package (defaults to the selected branch head)
        required: false
        type: string
      release_version:
        description: New installer version (an existing release is never overwritten)
        required: true
        type: string
        default: '2026.11.7'
      publish:
        description: Publish the verified installer as a prerelease
        required: false
        default: false
        type: boolean
  push:
    branches: [codex/actelyo-local-modules-20261003, feat/legal-workspaces-billing]
    paths:
      - .github/workflows/actelyo-law-harness-download.yml
      - scripts/actelyo-download/**
      - scripts/bundles/stage.py
      - scripts/build/frontend-common.mjs
      - apps/desktop/scripts/run-electron-builder.mjs
      - apps/desktop/scripts/run-electron-builder.test.mjs
      - optional-skills/finance/france-accounting-tax/**
      - agent/prompt_builder.py
      - hermes_cli/legal_practice.py
      - hermes_cli/legal_library.py
      - hermes_cli/legal_workflow.py
      - hermes_cli/local_runtime/inference_check.py
      - apps/desktop/src/app/settings/local-models-inference*
      - scripts/actelyo_library_pack.py
      - apps/desktop/src/app/chat/sidebar/legal-practice/**
      - mcp-servers/actelyo-rag/**
      - skills/legal/**
      - tools/legal_cabinet.py
      - tools/actelyo_studio.py
      - apps/desktop/electron/procedure-capture*
      - apps/desktop/src/app/chat/sidebar/*workbench*
      - apps/desktop/src/app/chat/sidebar/procedure-learning*
      - apps/desktop/src/app/chat/sidebar/legal-*
      - tui_gateway/methods_legal_practice.py
      - tui_gateway/contracts/legal_practice.py
permissions:
  contents: write
concurrency:
  group: actelyo-law-harness-download
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      HERMES_DESKTOP_VARIANT: bundled
      # Keep the established product pin on its legacy branch; PR/manual builds use the selected source head.
      ACTELYO_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      ACTELYO_RELEASE_VERSION: ${{ inputs.release_version || '2026.11.4' }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - name: Admit a distinct installer version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:ACTELYO_RELEASE_VERSION -notmatch '^\d{4}\.\d{1,2}\.\d{1,2}(?:\.\d{1,4})?$') { throw 'Invalid Actelyo release version' }
          $exists = $true
          try {
            $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/desktop-law-v$env:ACTELYO_RELEASE_VERSION"
            Invoke-RestMethod -Uri $uri -Headers @{ Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json' } | Out-Null
          } catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
            $exists = $false
          }
          if ($exists) { throw 'This release version already exists; choose a new version instead of replacing published files.' }
      - name: Keep verifier and select exact product source
        shell: pwsh
        run: |
          if ($env:ACTELYO_SOURCE_SHA -notmatch '^[0-9a-fA-F]{40}$') { throw 'Product source must be a full commit SHA' }
          Copy-Item scripts/actelyo-download/verify-installed.mjs "$env:RUNNER_TEMP/verify-actelyo-installed.mjs"
          git fetch origin $env:ACTELYO_SOURCE_SHA --depth=1
          if ($LASTEXITCODE -ne 0) { throw 'Product source unavailable' }
          git checkout --detach $env:ACTELYO_SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Cannot select product source' }
      - name: Prepare locked Python and Node toolchain
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '[]'
          test-environment: 'true'
      - name: Test installed-app readiness verifier
        run: node --test scripts/actelyo-download/verify-installed.test.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Test Actelyo workbench UI
        working-directory: apps/desktop
        run: npx vitest run --project ui src/app/chat/sidebar/procedure-learning-dialog.test.tsx src/app/chat/sidebar/rea-workbench-dialog.test.tsx src/app/chat/sidebar/atelier-dialog.test.tsx src/app/chat/sidebar/legal-practice/cabinet-navigation.test.tsx src/app/chat/sidebar/legal-practice/library-import.test.tsx src/app/chat/sidebar/legal-practice/tasks.test.tsx src/app/settings/local-models-inference.test.tsx src/app/chat/composer/attach-image-batch.test.ts --maxWorkers=1
      - name: Test private library import and extraction
        shell: bash
        run: scripts/run_tests.sh tests/test_actelyo_workflow.py tests/test_actelyo_inference.py tests/test_actelyo_library_pack.py tests/tools/test_legal_cabinet_tool.py tests/tui_gateway/test_legal_practice_rpc.py tests/hermes_cli/test_atelier.py tests/tui_gateway/test_atelier_rpc.py tests/agent/test_native_codex_init.py -q -j 1
      - name: Test window capture consent and limits
        working-directory: apps/desktop
        run: npx vitest run --project electron electron/procedure-capture.test.ts --maxWorkers=1
      - name: Test Studio profile isolation
        shell: bash
        run: scripts/run_tests.sh tests/tools/test_actelyo_studio.py tests/hermes_cli/test_local_models_activate_rescan.py -q -j 1
      - name: Restore verified local runtime inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: payload
        with:
          path: apps/desktop/build/agent-payload
          key: actelyo-payload-${{ runner.os }}-${{ env.ACTELYO_SOURCE_SHA }}
      - name: Stage the local agent runtime
        if: steps.payload.outputs.cache-hit != 'true'
        run: node scripts/build/python.mjs scripts/bundles/stage.py --out apps/desktop/build/agent-payload --icons .
      - name: Save complete runtime inputs before packaging
        if: steps.payload.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/build/agent-payload
          key: actelyo-payload-${{ runner.os }}-${{ env.ACTELYO_SOURCE_SHA }}
      - name: Build current desktop
        run: npm run build --workspace apps/desktop
      - name: Package Windows bundled application
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $nativeVersion = $env:ACTELYO_RELEASE_VERSION
          if (($nativeVersion -split '\.').Count -eq 3) { $nativeVersion += '.0' }
          node scripts/run-electron-builder.mjs --win --dir --x64 --publish never "--config.extraMetadata.version=$env:ACTELYO_RELEASE_VERSION" "--config.buildVersion=$nativeVersion" "--config.extraMetadata.shortVersion=$nativeVersion" "--config.extraMetadata.shortVersionWindows=$nativeVersion"
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
      - name: Build and install Actelyo installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'actelyo-release'
          New-Item -ItemType Directory $releaseDir -Force | Out-Null
          # Preserve diagnostics as artifacts if packaging or installation fails.
          $transcriptPath = Join-Path $releaseDir 'installer-diagnostics.log'
          Start-Transcript -Path $transcriptPath -Force | Out-Null
          try {
            # The deliverable is Inno's installer. Avoid compressing and expanding
            # a second multi-gigabyte archive merely to feed the same files to Inno.
            $workspaceRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\')+'\'
            $tempRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')+'\'
            $unpacked = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/release/win-unpacked'))
            $appSource = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'a'))
            if (!$unpacked.StartsWith($workspaceRoot,[StringComparison]::OrdinalIgnoreCase) -or !$appSource.StartsWith($tempRoot,[StringComparison]::OrdinalIgnoreCase)) { throw 'Unexpected installer staging paths' }
            if (!(Test-Path -LiteralPath (Join-Path $unpacked 'Actelyo Law Harness.exe')) -or (Test-Path -LiteralPath $appSource)) { throw 'Unpacked application missing or staging destination already exists' }
            # Use a short verified runner path for deeply nested Python packages.
            Move-Item -LiteralPath $unpacked -Destination $appSource
            if (-not (Test-Path (Join-Path $appSource 'Actelyo Law Harness.exe'))) { throw 'Wrong application identity' }
            $metadata = (Get-Item (Join-Path $appSource 'Actelyo Law Harness.exe')).VersionInfo
            foreach ($value in @($metadata.ProductVersion, $metadata.FileVersion)) {
              if ($value -ne $env:ACTELYO_RELEASE_VERSION -and $value -ne "$env:ACTELYO_RELEASE_VERSION.0") { throw "Native EXE version differs from the installer: $value" }
            }
            # Inno Setup 6 cannot reliably compile/install the long Python paths in the bundled runtime.
            # Pin stable Inno Setup 7 and verify the official Authenticode publisher before running it.
            $innoVersion = '7.1.0'
            $innoInstaller = Join-Path $env:RUNNER_TEMP "innosetup-$innoVersion-x64.exe"
            $innoUrl = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe"
            Invoke-WebRequest -Uri $innoUrl -OutFile $innoInstaller
            $signature = Get-AuthenticodeSignature -FilePath $innoInstaller
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
              throw 'Inno Setup installer signature or publisher verification failed'
            }
            $innoRoot = Join-Path $env:RUNNER_TEMP 'InnoSetup7'
            $setup = Start-Process -FilePath $innoInstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$innoRoot") -WindowStyle Hidden -Wait -PassThru
            if ($setup.ExitCode -ne 0) { throw "Inno Setup installation failed: $($setup.ExitCode)" }
            $compiler = Join-Path $innoRoot 'ISCC.exe'
            if (-not (Test-Path $compiler)) { throw 'Pinned Inno Setup 7 compiler unavailable after installation' }
            $compileLog = Join-Path $releaseDir 'installer-compile.log'
            $compileOutput = & $compiler "/DAppSource=$appSource" "/DReleaseDir=$releaseDir" "/DBuildVersion=$env:ACTELYO_RELEASE_VERSION" scripts/actelyo-download/installer.iss 2>&1
            $compileExitCode = $LASTEXITCODE
            $compileOutput | Set-Content -LiteralPath $compileLog
            $compileOutput | Write-Output
            if ($compileExitCode -ne 0) { throw "Installer compilation failed with exit code $compileExitCode" }
            # Exercise the normal per-user install location so deep bundled Python paths are tested under a realistic Windows profile.
            $installed = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'Programs\Actelyo Law Harness'
            $installer = Join-Path $releaseDir 'Actelyo-Law-Harness-Setup-x64.exe'
            $installLog = Join-Path $releaseDir 'installer-install.log'
            $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/LOG=`"$installLog`"","/DIR=`"$installed`"",'/TASKS=desktopicon') -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
            $shortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Actelyo Law Harness.lnk'
            $link = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut)
            if ($link.TargetPath -ne (Join-Path $installed 'Actelyo Law Harness.exe')) { throw 'Desktop shortcut target mismatch' }
            if ($link.IconLocation -notlike '*Actelyo Law Harness.exe*') { throw 'Desktop shortcut icon mismatch' }
            "ACTELYO_INSTALLED=$installed" >> $env:GITHUB_ENV
          } finally {
            Stop-Transcript | Out-Null
          }
      - name: Verify actual installed application
        run: node "$env:RUNNER_TEMP/verify-actelyo-installed.mjs" "$env:ACTELYO_INSTALLED" actelyo-release/proof
      - name: Verify actual installed native window icon
        shell: powershell
        run: |
          scripts/actelyo-download/window-branding.ps1 -Executable "$env:ACTELYO_INSTALLED/Actelyo Law Harness.exe" -ExpectedIcon apps/desktop/assets/icon.ico -ProofDirectory "$env:RUNNER_TEMP/law-window-proof" -Product 'Actelyo Law Harness'
          if (-not $?) { throw 'Native window icon verification failed' }
          Copy-Item "$env:RUNNER_TEMP/law-window-proof/window-branding.json" actelyo-release/proof/native-window-branding.json
          Copy-Item "$env:RUNNER_TEMP/law-window-proof/window-icon.png" actelyo-release/proof/native-window-icon.png
          powershell -NoProfile -File scripts/actelyo-download/window-branding.ps1 -Executable actelyo-release/Actelyo-Law-Harness-Setup-x64.exe -ExpectedIcon apps/desktop/assets/icon.ico -ProofDirectory "$env:RUNNER_TEMP/law-setup-icon-proof" -Product 'Actelyo Law Harness Setup' -ExecutableIconOnly
          if ($LASTEXITCODE -ne 0) { throw 'Setup executable icon verification failed' }
          Copy-Item "$env:RUNNER_TEMP/law-setup-icon-proof/executable-branding.json" actelyo-release/proof/setup-executable-branding.json
          Copy-Item "$env:RUNNER_TEMP/law-setup-icon-proof/executable-icon.png" actelyo-release/proof/setup-executable-icon.png
      - name: Record checksum and exact source
        shell: pwsh
        run: |
          $file = 'actelyo-release/Actelyo-Law-Harness-Setup-x64.exe'
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Actelyo-Law-Harness-Setup-x64.exe" | Set-Content actelyo-release/SHA256SUMS.txt
          @{ product='Actelyo Law Harness'; source_commit=$env:ACTELYO_SOURCE_SHA; packaging_commit=$env:GITHUB_SHA; artifact='Actelyo-Law-Harness-Setup-x64.exe'; version=$env:ACTELYO_RELEASE_VERSION; sha256=$hash; bytes=(Get-Item $file).Length; signed=$false; model_included=$false; windows='10/11 x64'; verified_installed=$true } | ConvertTo-Json | Set-Content actelyo-release/build-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: actelyo-law-harness-windows-verification
          path: |
            actelyo-release/*.txt
            actelyo-release/*.log
            actelyo-release/*.json
            actelyo-release/proof/*.png
            actelyo-release/proof/*.json
          if-no-files-found: ignore
      - name: Capture window and taskbar icon proof
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          $proof = 'actelyo-release/icon-proof'; New-Item -ItemType Directory -Force $proof | Out-Null
          $exe = Join-Path $env:ACTELYO_INSTALLED 'Actelyo Law Harness.exe'
          [System.Drawing.Icon]::ExtractAssociatedIcon($exe).ToBitmap().Save("$proof/exe-icon.png")
          (New-Object System.Drawing.Icon (Join-Path $env:ACTELYO_INSTALLED 'resources\icon.ico'), 256, 256).ToBitmap().Save("$proof/window-icon-resource.png")
          $setup = 'actelyo-release/Actelyo-Law-Harness-Setup-x64.exe'
          [System.Drawing.Icon]::ExtractAssociatedIcon($setup).ToBitmap().Save("$proof/installer-icon.png")
          $p = Start-Process $exe -WorkingDirectory $env:ACTELYO_INSTALLED -PassThru
          Start-Sleep 75
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          $bmp.Save("$proof/app-running-fullscreen.png"); $g.Dispose()
          $tb = $bmp.Clone((New-Object System.Drawing.Rectangle 0, ($b.Height - 60), $b.Width, 60), $bmp.PixelFormat); $tb.Save("$proof/taskbar.png"); $bmp.Dispose()
          $fam = @(Get-Process | Where-Object { try { $_.Path -and $_.Path.StartsWith($env:ACTELYO_INSTALLED, 'OrdinalIgnoreCase') } catch { $false } })
          $titles = @($fam | Where-Object MainWindowTitle | ForEach-Object MainWindowTitle | Select-Object -Unique)
          @{ processes = $fam.Count; windowTitles = $titles; version = (Get-ItemProperty 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{4B617AF4-6EA4-4220-849A-8044F224B92C}_is1' -ErrorAction SilentlyContinue).DisplayVersion } | ConvertTo-Json | Set-Content "$proof/report.json"
          Get-Content "$proof/report.json"
          $fam | Stop-Process -Force -ErrorAction SilentlyContinue
          if ($titles.Count -eq 0) { throw 'Installed app did not open a window' }
      - name: Publish proof as a draft release
        if: success() && inputs.publish && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $files = @(Get-ChildItem actelyo-release/icon-proof, actelyo-release/proof -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.png', '.json' } | ForEach-Object FullName)
          if ($files) { gh release create "qa-proof-law-violet-${{ github.run_id }}" @files --draft --target $env:GITHUB_SHA --title 'QA proof Law Harness violet logo' --notes 'Preuves QA automatiques.' }
      - name: Split verified installer into release-sized review parts
        shell: pwsh
        run: |
          $version = $env:ACTELYO_RELEASE_VERSION
          $name = "Actelyo-Law-Harness-Setup-$version-x64.exe"
          $out = 'actelyo-release/dist'; New-Item -ItemType Directory -Force $out | Out-Null
          $setup = 'actelyo-release/Actelyo-Law-Harness-Setup-x64.exe'
          $len = (Get-Item $setup).Length
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content "$out/SHA256SUMS.txt"
          $buf = New-Object byte[] (8MB); $in = [IO.File]::OpenRead((Resolve-Path $setup)); $n = 1
          while ($in.Position -lt $len) {
            $pp = Join-Path $out ("$name.part{0:D2}" -f $n); $o = [IO.File]::Create((Join-Path (Get-Location) $pp)); $w = 0
            while ($w -lt 1000000000 -and ($r = $in.Read($buf, 0, [Math]::Min($buf.Length, 1000000000 - $w))) -gt 0) { $o.Write($buf, 0, $r); $w += $r }
            $o.Dispose(); $n++
          }
          $in.Dispose()
          Get-ChildItem $out -Filter '*.part*' | Sort-Object Name | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Add-Content "$out/SHA256SUMS.txt"
          Copy-Item actelyo-release/build-manifest.json $out/
          $parts = @(Get-ChildItem $out -Filter '*.part*' | Sort-Object Name | ForEach-Object { @{ name=$_.Name; bytes=$_.Length; sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() } })
          @{ artifact=$name; bytes=$len; sha256=$hash; parts=$parts } | ConvertTo-Json -Depth 5 | Set-Content "$out/parts.json"
          Get-Content "$out/SHA256SUMS.txt"
      - name: Retain the exact verified installer for publication review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: actelyo-law-harness-verified-installer
          path: actelyo-release/dist/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Create explicitly requested draft release
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/codex/actelyo-local-modules-20261003') || inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = $env:ACTELYO_RELEASE_VERSION
          $out = 'actelyo-release/dist'
          $manifest = Get-Content "$out/parts.json" -Raw | ConvertFrom-Json
          $hash = $manifest.sha256; $len = $manifest.bytes
          $files = @(Get-ChildItem $out -File | ForEach-Object FullName)
          gh release create "desktop-law-v$version" @files --draft --target $env:ACTELYO_SOURCE_SHA --title "Actelyo Law Harness $version" --notes "Atelier de création de plugins par prompt, chronologies sourcées et corrections du moteur natif. Installation Windows vérifiée. SHA-256 $hash ($len octets), en $($manifest.parts.Count) parties. Aucun modèle privé inclus."
          if ($LASTEXITCODE -ne 0) { throw 'Draft release failed' }
      - name: Publish verified download
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/codex/actelyo-local-modules-20261003') || inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "desktop-law-v$env:ACTELYO_RELEASE_VERSION"
          gh release edit $tag --draft=false --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
