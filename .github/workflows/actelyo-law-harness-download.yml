name: Publish verified Actelyo Law 2026.11.9
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: actelyo-law-verified-publication-20261109
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Verify exact Windows QA and publish immutable installer parts
        run: node scripts/actelyo-download/publish-verified-20261109.cjs --publish-verified-public-source
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Preserve publication manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: law-2026.11.9-publication
          path: outputs/provider-upgrade/public-law-2026.11.9/*.json
          retention-days: 7
